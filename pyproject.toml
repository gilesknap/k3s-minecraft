[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcdash"
version = "0.1.0"
description = "Dashboard for launching and managing itzg Minecraft servers on Kubernetes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "kubernetes>=31",
    "nbtlib>=2.0",
]

[project.scripts]
mcdash = "mcdash.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "pyright>=1.1.380"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcdash"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs a real cluster (kind in CI)"]
addopts = "-m 'not e2e'"
