name: Release

# Tag X.Y.Z   -> image ghcr.io/gilesknap/k3s-minecraft:{X.Y.Z,X.Y,latest}
#               chart oci://ghcr.io/gilesknap/charts/minecraft-dashboard:X.Y.Z
#               (appVersion X.Y.Z)
# Push to main -> image :main and :sha-<sha7>
#               chart 0.0.0-main.<sha7> (appVersion sha-<sha7>), a semver
#               prerelease: plain `helm install` and version ranges ignore it,
#               so tpi-k3s-ansible can opt in explicitly to test main.

on:
  push:
    branches: [main]
    # pure semver tags, no "v" prefix (e.g. 0.1.0, 1.2.0-rc.1)
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gilesknap/k3s-minecraft
  CHART_REPO: oci://ghcr.io/gilesknap/charts
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v3.22.0

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.v.outputs.chart_version }}
      app_version: ${{ steps.v.outputs.app_version }}
    steps:
      - id: v
        run: |
          sha7="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag '$version' is not semver (X.Y.Z, no v prefix)"
              exit 1
            fi
            echo "chart_version=$version" >>"$GITHUB_OUTPUT"
            echo "app_version=$version" >>"$GITHUB_OUTPUT"
          else
            echo "chart_version=0.0.0-main.$sha7" >>"$GITHUB_OUTPUT"
            echo "app_version=sha-$sha7" >>"$GITHUB_OUTPUT"
          fi

  image:
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    # The chart's default image tag is its appVersion, so publish it only
    # after that image exists.
    needs: [versions, image]
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package
        env:
          CHART_VERSION: ${{ needs.versions.outputs.chart_version }}
          APP_VERSION: ${{ needs.versions.outputs.app_version }}
        run: |
          helm package charts/minecraft-dashboard \
            --version "$CHART_VERSION" --app-version "$APP_VERSION" \
            --destination dist

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push dist/minecraft-dashboard-*.tgz "$CHART_REPO"
