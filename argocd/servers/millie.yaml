# see the chart values defaults and descriptions here:
# https://artifacthub.io/packages/helm/minecraft-server-charts/minecraft?modal=values
minecraftServer:
  rcon:
    enabled: false
    nodePort: 31701
    serviceType: NodePort
  version: LATEST
  nodePort: 31700
  downloadWorldUrl: /data/2021-05-15-21_57_22-millie.zip
  motd: "The Soj"
  gameMode: creative
  whitelist: TransformerScorn,DispenserAD11
  ops: TransformerScorn,DispenserAD11
  forcegameMode: true
  maxWorldSize: 29999984
  serviceType: NodePort
  viewDistance: 32
  # Java VM memory reservation - make sure k8s resources matches
  memory: 2g

extraEnv:
  ENABLE_ROLLING_LOGS: true
  OVERRIDE_SERVER_PROPERTIES: true
  FORCE_WORLD_COPY: false

# securityContext:
#   runAsUser: 1022
#   fsGroup: 1022

# always reuse an existing nfs mount so the world survives chart deletion
persistence:
  storageClass: longhorn
  dataDir:
    enabled: true
    Size: 1Gi
    accessModes:
      - ReadWriteOnce

# run on the turing pi nodes!
nodeSelector:
  kubernetes.io/arch: arm64

# extraVolumes:
#   - volumeMounts:
#       - name: bigdisk
#         mountPath: /bigdisk
#         readOnly: true
#     volumes:
#       - name: bigdisk
#         nfs:
#           server: 192.168.0.20
#           path: /bigdisk

# kubernetes memory/cpu reservation/limits
resources:
  requests:
    memory: 2Gi
    cpu: 1
  limits:
    memory: 3Gi
    cpu: 8
